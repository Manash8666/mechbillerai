<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoBan - Responsive SaaS</title>
    <style>
        :root {
            /* Oatmeal & Ink Design System */
            --canvas-light: #F3EDE2;
            --surface-light: #D8D1C7;
            --ink-light: #2B2B2B;
            --gold: #C9A84C;
            --gold-light: #E8D6B3;
            
            /* Semantic Colors */
            --sage: #8FA89B;
            --ochre: #D4A373;
            --terracotta: #C97A7A;

            /* Glass Effects */
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.8);
            --glass-shadow: 0 10px 30px rgba(43, 43, 43, 0.06);
            --float-shadow: 0 15px 25px rgba(43, 43, 43, 0.15);
            
            /* Typography: Using Roboto for Android/Google alignment, but styled elegantly */
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--canvas-light);
            color: var(--ink-light);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* ================= DESKTOP SIDEBAR (Hidden on Mobile) ================= */
        .sidebar {
            width: 280px;
            height: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 32px 24px;
            z-index: 10;
        }

        .brand {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 40px;
            color: var(--ink-light);
        }

        .brand span { color: var(--gold); }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 15px;
            color: var(--ink-light);
            opacity: 0.6;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-item.active {
            background: rgba(201, 168, 76, 0.1);
            color: var(--gold);
            opacity: 1;
            font-weight: 700;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.5);
            opacity: 1;
        }

        /* ================= MAIN CONTENT AREA ================= */
        .main-content {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-y: auto;
            padding: 24px;
        }

        /* Android Status Bar (Only visible on mobile) */
        .android-status-bar {
            display: none;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            font-size: 13px;
            font-weight: 600;
            position: relative;
        }

        .punch-hole {
            position: absolute;
            left: 50%;
            top: 10px;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            background-color: #111;
            border-radius: 50%;
            z-index: 100;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            margin-top: 8px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: var(--surface-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            box-shadow: var(--glass-shadow);
            cursor: pointer;
        }

        /* Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            padding-bottom: 100px; /* Space for FAB/Bottom Nav */
        }

        /* Glass Cards */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: var(--glass-shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--float-shadow);
        }

        .card-label {
            font-size: 14px;
            font-weight: 600;
            opacity: 0.6;
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 16px;
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
        }

        .badge-gold { background-color: rgba(201, 168, 76, 0.15); color: var(--gold); }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 8px;
            background-color: var(--surface-light);
            border-radius: 4px;
            margin: 16px 0 8px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--sage);
            border-radius: 4px;
            width: 65%;
        }

        .progress-text {
            font-size: 13px;
            font-weight: 600;
            color: var(--sage);
        }

        /* Alert Card Layout */
        .alert-card {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .alert-icon {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            background-color: rgba(212, 163, 115, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .alert-icon svg { width: 24px; height: 24px; stroke: var(--ochre); }

        /* Floating Action Button (Android Style) */
        .fab {
            position: fixed;
            bottom: 32px;
            right: 32px;
            background-color: var(--gold);
            color: var(--ink-light);
            padding: 16px 28px;
            border-radius: 28px;
            font-size: 16px;
            font-weight: 700;
            box-shadow: var(--float-shadow);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 50;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .fab:active { transform: scale(0.95); }

        /* Android Bottom Navigation Bar (Hidden on Desktop) */
        .bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 76px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            justify-content: space-around;
            align-items: center;
            z-index: 40;
            padding-bottom: 12px;
        }

        .nav-tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--ink-light);
            opacity: 0.5;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        .nav-tab.active { opacity: 1; color: var(--gold); }
        
        /* Material Design Active Pill Indicator */
        .nav-tab .icon-wrapper {
            padding: 4px 16px;
            border-radius: 16px;
            transition: background 0.3s;
        }
        .nav-tab.active .icon-wrapper {
            background-color: rgba(201, 168, 76, 0.15);
        }

        .nav-icon { width: 24px; height: 24px; }

        /* ================= RESPONSIVE MEDIA QUERIES ================= */
        
        /* Mobile / Android View */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .android-status-bar { display: flex; }
            .bottom-nav { display: flex; }
            .dashboard-grid { grid-template-columns: 1fr; }
            .main-content { padding: 0 20px 20px 20px; }
            .fab { bottom: 96px; right: 20px; } /* Move FAB above bottom nav */
            .header { margin-top: 16px; }
        }

        /* Desktop / Laptop View */
        @media (min-width: 769px) {
            .bottom-nav { display: none; }
            .android-status-bar { display: none; }
        }
    </style>
</head>
<body>

    <!-- Desktop Sidebar Navigation -->
    <nav class="sidebar">
        <div class="brand">Mech<span>Biller</span>AI</div>
        
        <div class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
            Dashboard
        </div>
        <div class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
            Job Cards
        </div>
        <div class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
            Inventory
        </div>
        <div class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
            Invoices
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="main-content">
        
        <!-- Android Status Bar (Mobile Only) -->
        <div class="android-status-bar">
            <div class="punch-hole"></div>
            <span>10:30</span>
            <div style="display: flex; gap: 6px; align-items: center;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
            </div>
        </div>

        <!-- Header -->
        <header class="header">
            <h1>Dashboard</h1>
            <div class="avatar">M</div>
        </header>

        <!-- Dashboard Grid -->
        <div class="dashboard-grid">
            
            <!-- Revenue Card -->
            <div class="glass-card">
                <div class="card-label">Today's Revenue</div>
                <div class="card-value">₹14,500</div>
                <span class="badge badge-gold">+12% Growth</span>
            </div>

            <!-- Active Jobs Card -->
            <div class="glass-card">
                <div class="card-label">Active Job Cards</div>
                <div class="card-value">04</div>
                <div class="progress-container">
                    <div class="progress-fill"></div>
                </div>
                <div class="progress-text">3 In-Progress, 1 Pending</div>
            </div>

            <!-- Low Stock Alert -->
            <div class="glass-card alert-card">
                <div class="alert-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                        <line x1="12" y1="9" x2="12" y2="13"></line>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                </div>
                <div>
                    <div style="font-weight: 700; margin-bottom: 4px;">Low Stock Alert</div>
                    <div style="font-size: 13px; opacity: 0.6;">Brake Pads (OEM) - 2 Left</div>
                </div>
            </div>

            <!-- Additional Card for Desktop Grid Balance -->
            <div class="glass-card">
                <div class="card-label">Pending Invoices</div>
                <div class="card-value">₹8,200</div>
                <span class="badge" style="background-color: rgba(201, 122, 122, 0.15); color: var(--terracotta);">2 Overdue</span>
            </div>

        </div>

        <!-- Floating Action Button -->
        <div class="fab">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            New Job
        </div>

    </main>

    <!-- Android Bottom Navigation (Mobile Only) -->
    <nav class="bottom-nav">
        <div class="nav-tab active">
            <div class="icon-wrapper">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
            </div>
            Home
        </div>
        <div class="nav-tab">
            <div class="icon-wrapper">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
            </div>
            Jobs
        </div>
        <div class="nav-tab">
            <div class="icon-wrapper">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
            </div>
            Parts
        </div>
        <div class="nav-tab">
            <div class="icon-wrapper">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
            </div>
            Bills
        </div>
    </nav>

</body>
</html>
